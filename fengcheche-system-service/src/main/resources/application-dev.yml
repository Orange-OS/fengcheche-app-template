# 开发环境
spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          type: com.alibaba.druid.pool.DruidDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          # 系统服务独立库，避免和生活、报表等业务库耦合。
          url: jdbc:mysql://192.168.176.7:13306/fengcheche_system?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: root
        slave_1:
          url: jdbc:clickhouse://192.168.176.7:8123/default
          username: default
          password: 123456
          driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 8
        max-wait: 200s
        max-idle: 8
        min-idle: 0

logging:
  level:
    org.mybatis: DEBUG
  file:
    name: ./logs/fengcheche.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level){
      TRACE=magenta,
      DEBUG=blue,
      INFO=green,
      WARN=yellow,
      ERROR=red
    } %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 30

file:
  dir: E:\文件上传\fengcheche-template

