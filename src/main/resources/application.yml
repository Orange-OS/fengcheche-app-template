# 主配置文件（公共配置）
server:
  port: 8080
  servlet:
    context-path: /fengcheche

spring:
  profiles:
    active: dev  # 默认使用 dev 环境
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 添加 JdbcType 自动映射
    jdbc-type-for-null: null
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zsy.module.*.*.domain
  type-handlers-package: com.zsy.config

# Sa-Token 配置
sa-token:
  # token 名称 (同时也是cookie名称)
  token-name: satoken
  # token 有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # 是否允许同一账号并发登录 (为true时允许一个账号多地同时登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: true
  # 是否从请求头中读取token
  is-read-header: true
  # 是否将token保存到cookie中
  is-write-cookie: true
  # 配置 Sa-Token 使用 Redis 存储
  token-dao-name: redis

logging:
  level:
    org.mybatis: DEBUG

# 心跳配置
heart-beat:
  interval-seconds: 60

# Swagger 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.zsy
