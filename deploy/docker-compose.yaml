version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: fengcheche-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fengcheche_system
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - ./mysql/mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro # 首次创建容器数据目录时自动初始化分库脚本
    networks:
      - fengcheche-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.1ms.run/library/redis:6.2.21-alpine
    container_name: fengcheche-redis
    ports:
      - "16379:6379"
    volumes:
      - ./redis/redis-data:/data
    networks:
      - fengcheche-network
    command: redis-server --appendonly yes
    restart: unless-stopped # 除非用户显式停止，否则总是重启

  springboot-app:
    image: openjdk:8u342-jre-buster
    container_name: fengcheche-app
    ports:
      - "18090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=test
    volumes:
      - ./app/fengcheche-template.jar:/app/app.jar
      - ./logs:/app/logs # 持久化日志
    command: java -jar /app/app.jar
    networks:
      - fengcheche-network
    restart: unless-stopped

  nginx:
    image: docker.1ms.run/library/nginx:1.23-alpine
    container_name: fengcheche-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    networks:
      - fengcheche-network
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fengcheche-network:
    driver: bridge
